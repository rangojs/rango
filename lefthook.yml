pre-commit:
  parallel: true
  jobs:
    - name: format
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
      glob: "*.{ts,tsx,js,jsx,json,css}"
      exclude:
        - "*.gen.ts"
    - name: lint
      run: pnpm -w run lint
      glob: "*.{ts,tsx,js,jsx}"
    - name: e2e-bucketing
      run: node tools/check-e2e-bucketing.mjs
      glob: "*.test.{ts,tsx,js,jsx}"

post-merge:
  jobs:
    - name: install
      run: pnpm install --frozen-lockfile
