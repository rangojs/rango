pre-commit:
  parallel: true
  jobs:
    - name: format
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
      glob: "*.{ts,tsx,js,jsx,json,css}"
    - name: lint
      run: pnpm -w run lint
      glob: "*.{ts,tsx,js,jsx}"

post-merge:
  jobs:
    - name: install
      run: git diff-tree -r --name-only ORIG_HEAD HEAD | grep -q pnpm-lock.yaml && pnpm install --frozen-lockfile || true
