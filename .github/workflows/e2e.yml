name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # On push to main, wait 2 minutes before starting CI. Combined with
  # cancel-in-progress, a follow-up push within the window cancels this
  # run so only the latest commit gets a full suite. Instant for PRs.
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for additional pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 120

  lint:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run oxlint
        run: pnpm lint

      - name: Check e2e dev/prod bucketing
        run: pnpm check:e2e-bucketing

      - name: Check e2e dev/prod parity
        run: node tools/check-e2e-parity.mjs --strict

      - name: Check internal doc links
        run: pnpm check:doc-links

      - name: Check positioning-doc API references
        run: pnpm check:docs-api

      - name: Check skills frontmatter and cross-references
        run: pnpm check:skills

      - name: Check skills catalog is current
        run: pnpm check:skills-catalog

  format:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

  install-playwright:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @rangojs/router exec playwright install --with-deps chromium

  typecheck:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Package type conditions point at dist/types. Turbo's ^build dependency
      # also builds the workspace router before consumer typechecks, but keep
      # declaration generation explicit here so this CI contract cannot drift
      # with a future task-graph change.
      - name: Build rangojs-router declarations
        run: pnpm --filter @rangojs/router build:types

      - name: Run typecheck
        run: pnpm typecheck

  unit-tests:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build is needed here: generate-cli.test.ts spawns the built CLI
      # (dist/bin/rango.js) as a subprocess, so the unit suite needs dist/.
      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Run unit tests (router + consumer apps)
        run: pnpm run test:unit

      - name: Run RSC/Flight unit tests (router + consumer apps)
        run: pnpm run test:unit:rsc

  vite-rsc-demo-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dev
            shard: 1
          - project: dev
            shard: 2
          # Production tests run in single job (build-once via setup project)
          - project: production

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter vite-rsc-demo exec playwright install-deps chromium

      - name: Run demo app e2e tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter vite-rsc-demo exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
          else
            pnpm --filter vite-rsc-demo exec playwright test --project=${{ matrix.project }}
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-demo-${{ matrix.project }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: tests/vite-rsc-demo/playwright-report/
          retention-days: 7

  # smoke-e2e is a fast fail-signal that runs in parallel with the heavy e2e
  # jobs. It intentionally does NOT gate them (they depend only on
  # install-playwright): gating serialized smoke's ~110s ahead of the entire
  # e2e fan-out for no correctness benefit. Trade-off: a broken commit now
  # launches all e2e shards instead of being short-circuited by smoke.
  smoke-e2e:
    needs: [install-playwright]
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter @rangojs/router exec playwright install-deps chromium

      - name: Run smoke tests
        run: pnpm --filter @rangojs/router test --project=smoke

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-smoke
          path: packages/rangojs-router/playwright-report/
          retention-days: 7

  # Validates the Vercel preset's Build Output (.vercel/output) for a multi-app
  # host router: builds the app, then drives the isolated function with Host
  # headers, asserting each sub-app renders and an unmatched host returns 404
  # through the generated host entry. Pure Node (no Playwright).
  vercel-smoke:
    needs: [debounce]
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Smoke the Vercel host Build Output
        run: pnpm --filter rangojs-vercel-multi-router smoke

  vercel-basic-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter rangojs-vercel-basic exec playwright install-deps chromium

      # Real @vercel/otel registerOTel() path: builds and serves the isolated
      # .vercel/output, asserting it bundles + initializes without a cold-start
      # failure (the e2e below exercises the recording-tracer path instead).
      - name: Smoke the Vercel Build Output
        run: pnpm --filter rangojs-vercel-basic smoke

      - name: Run vercel-basic e2e tests (dev + production)
        run: pnpm --filter rangojs-vercel-basic test:e2e
        env:
          TEST_DEBUG: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-vercel-basic
          path: examples/vercel-basic/playwright-report/
          retention-days: 7

  rangojs-router-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # 30 (was 20): the 5-way dev split fixed the runner-OOM, but the shard that
    # draws the timing-sensitive dev tests (handle-breadcrumbs late-push +
    # cache param-change soft-navs) spends real time on per-test timeouts and
    # their Playwright retries under CI load, which brushed the old 20m cap.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev tests sharded across 5 jobs. Bumped from 3 -> 5: dev-mode e2e
          # keeps a live Vite dev server + esbuild + Chromium resident, and at
          # 3-way sharding the two heaviest shards exhausted the hosted runner's
          # memory, so the runner was terminated mid-run ("received a shutdown
          # signal" well under the 20m cap). Smaller shards fit the memory budget
          # and finish faster.
          - project: dev
            shard: 1
            shardTotal: 5
          - project: dev
            shard: 2
            shardTotal: 5
          - project: dev
            shard: 3
            shardTotal: 5
          - project: dev
            shard: 4
            shardTotal: 5
          - project: dev
            shard: 5
            shardTotal: 5
          # Production tests sharded across 2 jobs
          - project: production
            shard: 1
            shardTotal: 2
          - project: production
            shard: 2
            shardTotal: 2
          # HMR tests run serially (workers=1) to avoid filesystem interference.
          # hmr-routes (route-types-hmr.test.ts) is intentionally absent: it is
          # test.skip(isCI)'d because the file watcher is unreliable on GitHub
          # Actions' virtualized FS, so the job ran zero tests. Run it locally:
          # pnpm --filter @rangojs/router exec playwright test --project=hmr-routes
          - project: hmr-client
            workers: 1
          - project: hmr-loader
            workers: 1
          - project: hmr-intercept
            workers: 1
          # Host-routing runs in its own project + servers (gated by
          # RANGO_E2E_HOST below), so the sharded dev/production jobs above no
          # longer each boot the two host Vite servers (OOM-sensitive) or the
          # host:build, and a host-fixture breakage fails only this job.
          - project: host

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter @rangojs/router exec playwright install-deps chromium

      - name: Run rangojs-router e2e tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
        env:
          CHOKIDAR_USEPOLLING: ${{ matrix.workers && 'true' || '' }}
          # Only the dedicated host job starts the host fixture servers (and, via
          # HOST_ONLY in playwright.config.ts, skips the heavy test-app servers).
          RANGO_E2E_HOST: ${{ matrix.project == 'host' && '1' || '' }}
        run: |
          WORKERS_FLAG=""
          if [ -n "${{ matrix.workers }}" ]; then
            WORKERS_FLAG="--workers=${{ matrix.workers }}"
          fi
          # HMR projects use useFixture() to start their own dev server,
          # so skip dependency projects (dev, build, warmup) that would
          # re-run hundreds of unrelated tests and blow the timeout.
          NO_DEPS_FLAG=""
          if [[ "${{ matrix.project }}" == hmr-* ]]; then
            NO_DEPS_FLAG="--no-deps"
          fi
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter @rangojs/router test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shardTotal }} $WORKERS_FLAG $NO_DEPS_FLAG
          else
            pnpm --filter @rangojs/router test --project=${{ matrix.project }} $WORKERS_FLAG $NO_DEPS_FLAG
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-router-${{ matrix.project }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: packages/rangojs-router/playwright-report/
          retention-days: 7

  cloudflare-basic-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # 20 (unchanged, was a single un-sharded job): the suite grew from ~7.1m
    # (Jun 20) to ~11.6m (Jul 4) running the ENTIRE dev -> production -> hmr
    # chain sequentially in one runner at workers=1, making it the pipeline's
    # critical path. It is now sharded (dev x2 / production x2 / hmr) so each
    # job runs only a fraction of the 14m playwright globalTimeout
    # (playwright.config.ts), leaving ample headroom under this cap for the
    # ~3-4m of setup (install, router build, browser deps). Tightening the cap
    # is a data-driven follow-up once the sharded run times are measured — do
    # NOT pre-optimize.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev tests sharded across 2 jobs, WITHOUT --no-deps: the dev project
          # depends on the dev-warmup setup project (the #659 cold-miniflare
          # warmup), and Playwright runs a project's dependencies fully in every
          # shard — so keeping deps preserves the warmup on each runner.
          - project: dev
            shard: 1
            shardTotal: 2
          - project: dev
            shard: 2
            shardTotal: 2
          # Production tests sharded across 2 jobs WITH --no-deps: the production
          # project depends on the FULL dev project (~284 tests), so without
          # --no-deps every production shard would also drag the entire dev suite
          # (the 208-vs-1 blowup documented in AGENTS.md). --no-deps severs that;
          # the production webServer still builds dist/ and serves preview.
          - project: production
            shard: 1
            shardTotal: 2
            noDeps: true
          - project: production
            shard: 2
            shardTotal: 2
            noDeps: true
          # HMR runs in its own job: --no-deps (its deps are the full dev +
          # production suites) and workers=1. workers=1 is load-bearing, not
          # cosmetic: hmr.test.ts and hmr-route-mutations.test.ts both git-checkout
          # and rewrite src/ files, so two parallel workers corrupt each other's
          # fixtures. (On CI hmr-route-mutations is test.skip(isCI)'d, but the cap
          # matches the local test:e2e:hmr-local script and guards the invariant.)
          - project: hmr
            workers: 1
            noDeps: true

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter cloudflare-basic exec playwright install-deps chromium

      - name: Run cloudflare-basic e2e tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
        env:
          TEST_DEBUG: "1"
        run: |
          SHARD_FLAG=""
          if [ -n "${{ matrix.shard }}" ]; then
            SHARD_FLAG="--shard=${{ matrix.shard }}/${{ matrix.shardTotal }}"
          fi
          WORKERS_FLAG=""
          if [ -n "${{ matrix.workers }}" ]; then
            WORKERS_FLAG="--workers=${{ matrix.workers }}"
          fi
          # production depends on the full dev project and hmr depends on
          # dev+production; --no-deps severs those so a shard runs only its own
          # tests. The webServer still builds/serves regardless of --no-deps.
          NO_DEPS_FLAG=""
          if [ -n "${{ matrix.noDeps }}" ]; then
            NO_DEPS_FLAG="--no-deps"
          fi
          pnpm --filter cloudflare-basic test:e2e --project=${{ matrix.project }} $SHARD_FLAG $WORKERS_FLAG $NO_DEPS_FLAG

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-cloudflare-basic-${{ matrix.project }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: tests/cloudflare-basic/playwright-report/
          retention-days: 7

  cloudflare-multi-router-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter cloudflare-multi-router exec playwright install-deps chromium

      - name: Run cloudflare-multi-router e2e tests
        run: pnpm --filter cloudflare-multi-router test:e2e
        env:
          TEST_DEBUG: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-cloudflare-multi-router
          path: examples/cloudflare-multi-router/playwright-report/
          retention-days: 7

  react-experimental-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter react-experimental exec playwright install-deps chromium

      - name: Run react-experimental e2e tests
        run: pnpm --filter react-experimental test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-react-experimental
          path: tests/react-experimental/playwright-report/
          retention-days: 7

  no-typescript-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter no-typescript exec playwright install-deps chromium

      - name: Run no-typescript e2e tests
        run: pnpm --filter no-typescript test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-no-typescript
          path: tests/no-typescript/playwright-report/
          retention-days: 7

  cloudflare-stress-demo-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter cloudflare-stress-demo exec playwright install-deps chromium

      - name: Run cloudflare-stress-demo e2e tests
        run: pnpm --filter cloudflare-stress-demo test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-cloudflare-stress-demo
          path: tests/cloudflare-stress-demo/playwright-report/
          retention-days: 7
