name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # On push to main, wait 2 minutes before starting CI. Combined with
  # cancel-in-progress, a follow-up push within the window cancels this
  # run so only the latest commit gets a full suite. Instant for PRs.
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for additional pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 120

  lint:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run oxlint
        run: pnpm lint

      - name: Check e2e dev/prod bucketing
        run: pnpm check:e2e-bucketing

      - name: Check internal doc links
        run: pnpm check:doc-links

  format:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format

  install-playwright:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @rangojs/router exec playwright install --with-deps chromium

  typecheck:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # No router build: typecheck resolves @rangojs/router types from src
      # (the exports map `types` points at ./src/*), so dist/ is not needed.
      - name: Run typecheck
        run: pnpm typecheck

  unit-tests:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # The build is needed here: generate-cli.test.ts spawns the built CLI
      # (dist/bin/rango.js) as a subprocess, so the unit suite needs dist/.
      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Run unit tests (router + consumer apps)
        run: pnpm run test:unit

      - name: Run RSC/Flight unit tests (router + consumer apps)
        run: pnpm run test:unit:rsc

  vite-rsc-demo-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dev
            shard: 1
          - project: dev
            shard: 2
          # Production tests run in single job (build-once via setup project)
          - project: production

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter vite-rsc-demo exec playwright install-deps chromium

      - name: Run demo app e2e tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter vite-rsc-demo exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
          else
            pnpm --filter vite-rsc-demo exec playwright test --project=${{ matrix.project }}
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-demo-${{ matrix.project }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: tests/vite-rsc-demo/playwright-report/
          retention-days: 7

  # smoke-e2e is a fast fail-signal that runs in parallel with the heavy e2e
  # jobs. It intentionally does NOT gate them (they depend only on
  # install-playwright): gating serialized smoke's ~110s ahead of the entire
  # e2e fan-out for no correctness benefit. Trade-off: a broken commit now
  # launches all e2e shards instead of being short-circuited by smoke.
  smoke-e2e:
    needs: [install-playwright]
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter @rangojs/router exec playwright install-deps chromium

      - name: Run smoke tests
        run: pnpm --filter @rangojs/router test --project=smoke

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-smoke
          path: packages/rangojs-router/playwright-report/
          retention-days: 7

  rangojs-router-e2e:
    needs: [install-playwright]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # 30 (was 20): the 5-way dev split fixed the runner-OOM, but the shard that
    # draws the timing-sensitive dev tests (handle-breadcrumbs late-push +
    # cache param-change soft-navs) spends real time on per-test timeouts and
    # their Playwright retries under CI load, which brushed the old 20m cap.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev tests: 7 shards x 1 worker (serial). dev-mode e2e keeps a live
          # Vite dev server + esbuild + Chromium resident, so per-shard peak
          # memory is (workers x Chromium) + the dev server. The suite has crept
          # to the hosted-runner memory ceiling as recent PRs each added e2e
          # files, so the heaviest shards OOM mid-run ("received a shutdown
          # signal" / SIGTERM well under the 30m cap), which also makes the
          # timing-sensitive tests (handle-breadcrumbs late-push, cache
          # param-change soft-navs) time out under the pressure. Sharding alone
          # stopped helping (3 -> 5 -> 6 -> 7 only moved which shard OOM'd as
          # re-sharding reclustered the heavy files), and workers:2 cleared the
          # cache.test.ts shard but not the handle-breadcrumbs shard. workers:1
          # is the memory floor: one Chromium + the dev server per shard, far
          # under the ceiling, and 7 shards keep each serial run fast.
          - project: dev
            shard: 1
            shardTotal: 7
            workers: 1
          - project: dev
            shard: 2
            shardTotal: 7
            workers: 1
          - project: dev
            shard: 3
            shardTotal: 7
            workers: 1
          - project: dev
            shard: 4
            shardTotal: 7
            workers: 1
          - project: dev
            shard: 5
            shardTotal: 7
            workers: 1
          - project: dev
            shard: 6
            shardTotal: 7
            workers: 1
          - project: dev
            shard: 7
            shardTotal: 7
            workers: 1
          # Production tests sharded across 2 jobs
          - project: production
            shard: 1
            shardTotal: 2
          - project: production
            shard: 2
            shardTotal: 2
          # HMR tests run serially (workers=1) to avoid filesystem interference.
          # hmr-routes (route-types-hmr.test.ts) is intentionally absent: it is
          # test.skip(isCI)'d because the file watcher is unreliable on GitHub
          # Actions' virtualized FS, so the job ran zero tests. Run it locally:
          # pnpm --filter @rangojs/router exec playwright test --project=hmr-routes
          - project: hmr-client
            workers: 1
          - project: hmr-loader
            workers: 1
          - project: hmr-intercept
            workers: 1

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter @rangojs/router exec playwright install-deps chromium

      - name: Run rangojs-router e2e tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
        env:
          # Only the HMR projects need the polling watcher; gating on project (not
          # matrix.workers) lets non-HMR jobs set workers without paying watcher memory.
          CHOKIDAR_USEPOLLING: ${{ startsWith(matrix.project, 'hmr') && 'true' || '' }}
        run: |
          WORKERS_FLAG=""
          if [ -n "${{ matrix.workers }}" ]; then
            WORKERS_FLAG="--workers=${{ matrix.workers }}"
          fi
          # HMR projects use useFixture() to start their own dev server,
          # so skip dependency projects (dev, build, warmup) that would
          # re-run hundreds of unrelated tests and blow the timeout.
          NO_DEPS_FLAG=""
          if [[ "${{ matrix.project }}" == hmr-* ]]; then
            NO_DEPS_FLAG="--no-deps"
          fi
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter @rangojs/router test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shardTotal }} $WORKERS_FLAG $NO_DEPS_FLAG
          else
            pnpm --filter @rangojs/router test --project=${{ matrix.project }} $WORKERS_FLAG $NO_DEPS_FLAG
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-router-${{ matrix.project }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: packages/rangojs-router/playwright-report/
          retention-days: 7

