    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-jammy
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Containerised jobs run as root while the workspace files are owned by
      # the runner user, which makes git refuse ("dubious ownership") and
      # breaks the lefthook install in the pnpm prepare script. Harmless on
