name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Run typecheck
        run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Run unit tests
        run: pnpm --filter @rangojs/router test:unit

  vite-rsc-demo-e2e:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dev
          # Production tests run in single job (build-once via setup project)
          - project: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Install Playwright browsers
        run: pnpm --filter vite-rsc-demo exec playwright install --with-deps chromium

      - name: Run demo app e2e tests (${{ matrix.project }})
        run: pnpm --filter vite-rsc-demo exec playwright test --project=${{ matrix.project }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-demo-${{ matrix.project }}
          path: examples/vite-rsc-demo/playwright-report/
          retention-days: 7

  rangojs-router-e2e:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev tests sharded across 2 jobs
          - project: dev
            shard: 1
          - project: dev
            shard: 2
          # Production tests run in single job (build-once via setup project)
          - project: production
          # HMR tests run in single job
          - project: hmr

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Install Playwright browsers
        run: pnpm --filter @rangojs/router exec playwright install --with-deps chromium

      - name: Run rangojs-router e2e tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter @rangojs/router test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
          else
            pnpm --filter @rangojs/router test --project=${{ matrix.project }}
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-router-${{ matrix.project }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: packages/rangojs-router/playwright-report/
          retention-days: 7

  cloudflare-basic-e2e:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Install Playwright browsers
        run: pnpm --filter cloudflare-basic exec playwright install --with-deps chromium

      - name: Run cloudflare-basic e2e tests
        run: pnpm --filter cloudflare-basic test:e2e
        env:
          TEST_DEBUG: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cloudflare-basic
          path: examples/cloudflare-basic/playwright-report/
          retention-days: 7
