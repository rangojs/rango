name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # [TEMP] Disabled for HMR-only CI test — will be restored before merge
  # lint:
  # format:

  install-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @rangojs/router exec playwright install --with-deps chromium

  # [TEMP] Disabled for HMR-only CI test — will be restored before merge
  # typecheck:
  # unit-tests:

  # [TEMP] Disabled for HMR-only CI test — will be restored before merge
  # vite-rsc-demo-e2e:

  smoke-e2e:
    needs: [install-playwright]
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter @rangojs/router exec playwright install-deps chromium

      - name: Run smoke tests
        run: pnpm --filter @rangojs/router test --project=smoke

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: packages/rangojs-router/playwright-report/
          retention-days: 7

  rangojs-router-e2e:
    needs: [install-playwright, smoke-e2e]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # [TEMP] Only HMR for flake testing — will be restored before merge
          - project: hmr
            workers: 1

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright system deps
        run: pnpm --filter @rangojs/router exec playwright install-deps chromium

      - name: Run rangojs-router e2e tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
        run: |
          WORKERS_FLAG=""
          if [ -n "${{ matrix.workers }}" ]; then
            WORKERS_FLAG="--workers=${{ matrix.workers }}"
          fi
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter @rangojs/router test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shardTotal }} $WORKERS_FLAG
          else
            pnpm --filter @rangojs/router test --project=${{ matrix.project }} $WORKERS_FLAG
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-router-${{ matrix.project }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: packages/rangojs-router/playwright-report/
          retention-days: 7

  # [TEMP] Disabled for HMR-only CI test — will be restored before merge
  # cloudflare-basic-e2e:
  # react-experimental-e2e:
  # cloudflare-stress-demo-e2e:
