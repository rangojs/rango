name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # On push to main, wait 2 minutes before starting CI. Combined with
  # cancel-in-progress, a follow-up push within the window cancels this
  # run so only the latest commit gets a full suite. Instant for PRs.
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for additional pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 120

  lint:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Containerised jobs run as root while the workspace files are owned by
      # the runner user, which makes git refuse ("dubious ownership") and
      # breaks the lefthook install in the pnpm prepare script. Harmless on
      # non-container jobs.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run oxlint
        run: pnpm lint

  format:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Containerised jobs run as root while the workspace files are owned by
      # the runner user, which makes git refuse ("dubious ownership") and
      # breaks the lefthook install in the pnpm prepare script. Harmless on
      # non-container jobs.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format

  typecheck:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Containerised jobs run as root while the workspace files are owned by
      # the runner user, which makes git refuse ("dubious ownership") and
      # breaks the lefthook install in the pnpm prepare script. Harmless on
      # non-container jobs.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Run typecheck
        run: pnpm typecheck

  unit-tests:
    needs: [debounce]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Containerised jobs run as root while the workspace files are owned by
      # the runner user, which makes git refuse ("dubious ownership") and
      # breaks the lefthook install in the pnpm prepare script. Harmless on
      # non-container jobs.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Run unit tests
        run: pnpm --filter @rangojs/router test:unit

  vite-rsc-demo-e2e:
    needs: [smoke-e2e]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Playwright image ships browsers + system deps; skip ~15min apt install
    # per job. Tag must match the @playwright/test version in pnpm-lock.
    container: mcr.microsoft.com/playwright:v1.57.0-jammy
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dev
            shard: 1
          - project: dev
            shard: 2
          # Production tests run in single job (build-once via setup project)
          - project: production

    steps:
      - uses: actions/checkout@v5

      # Containerised jobs run as root while the workspace files are owned by
      # the runner user, which makes git refuse ("dubious ownership") and
      # breaks the lefthook install in the pnpm prepare script. Harmless on
      # non-container jobs.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Run demo app e2e tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter vite-rsc-demo exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
          else
            pnpm --filter vite-rsc-demo exec playwright test --project=${{ matrix.project }}
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-demo-${{ matrix.project }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: tests/vite-rsc-demo/playwright-report/
          retention-days: 7

  smoke-e2e:
    needs: [debounce]
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Containerised jobs run as root while the workspace files are owned by
      # the runner user, which makes git refuse ("dubious ownership") and
      # breaks the lefthook install in the pnpm prepare script. Harmless on
      # non-container jobs.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Run smoke tests
        run: pnpm --filter @rangojs/router test --project=smoke

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-smoke
          path: packages/rangojs-router/playwright-report/
          retention-days: 7

  rangojs-router-e2e:
    needs: [smoke-e2e]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-jammy
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev tests sharded across 3 jobs
          - project: dev
            shard: 1
            shardTotal: 3
          - project: dev
            shard: 2
            shardTotal: 3
          - project: dev
            shard: 3
            shardTotal: 3
          # Production tests sharded across 2 jobs
          - project: production
            shard: 1
            shardTotal: 2
          - project: production
            shard: 2
            shardTotal: 2
          # HMR tests run serially (workers=1) to avoid filesystem interference
          - project: hmr-client
            workers: 1
          - project: hmr-loader
            workers: 1
          - project: hmr-routes
            workers: 1
          - project: hmr-intercept
            workers: 1

    steps:
      - uses: actions/checkout@v5

      # Containerised jobs run as root while the workspace files are owned by
      # the runner user, which makes git refuse ("dubious ownership") and
      # breaks the lefthook install in the pnpm prepare script. Harmless on
      # non-container jobs.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Run rangojs-router e2e tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
        env:
          CHOKIDAR_USEPOLLING: ${{ matrix.workers && 'true' || '' }}
        run: |
          WORKERS_FLAG=""
          if [ -n "${{ matrix.workers }}" ]; then
            WORKERS_FLAG="--workers=${{ matrix.workers }}"
          fi
          # HMR projects use useFixture() to start their own dev server,
          # so skip dependency projects (dev, build, warmup) that would
          # re-run hundreds of unrelated tests and blow the timeout.
          NO_DEPS_FLAG=""
          if [[ "${{ matrix.project }}" == hmr-* ]]; then
            NO_DEPS_FLAG="--no-deps"
          fi
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter @rangojs/router test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shardTotal }} $WORKERS_FLAG $NO_DEPS_FLAG
          else
            pnpm --filter @rangojs/router test --project=${{ matrix.project }} $WORKERS_FLAG $NO_DEPS_FLAG
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-router-${{ matrix.project }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: packages/rangojs-router/playwright-report/
          retention-days: 7

  cloudflare-basic-e2e:
