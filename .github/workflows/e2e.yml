          path: examples/cloudflare-multi-router/playwright-report/
          retention-days: 7

  react-experimental-e2e:
    needs: [smoke-e2e]
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
