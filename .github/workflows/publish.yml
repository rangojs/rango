name: Publish

# npm auth is trusted publishing (OIDC) bound to this workflow file —
# renaming publish.yml breaks it until the npm-side config is updated.
on:
  workflow_dispatch:
    inputs:
      channel:
        description:
          "experimental: 0.0.0-experimental.N.<sha> under the experimental
          tag. latest: the committed package.json version under latest —
          land the chore(release) version bump on main first."
        type: choice
        options: [experimental, latest]
        default: experimental
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @rangojs/router
        run: pnpm --filter @rangojs/router build

      - name: Compute next version
        if: inputs.channel == 'experimental'
        id: version
        run: |
          CURRENT=$(npm view @rangojs/router@experimental version 2>/dev/null || echo "0.0.0-experimental.0")
          echo "Current experimental version: $CURRENT"

          # Extract the numeric part after "experimental."
          # Handle both "0.0.0-experimental.17" and "0.0.0-experimental.17.abc1234"
          NUM=$(echo "$CURRENT" | sed -E 's/^0\.0\.0-experimental\.([0-9]+).*/\1/')
          NEXT=$((NUM + 1))
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="0.0.0-experimental.${NEXT}.${SHORT_SHA}"

          echo "Next version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set version and publish (experimental)
        if: inputs.channel == 'experimental'
        working-directory: packages/rangojs-router
        run: |
          node -e "const p=require('./package.json');p.version='${{ steps.version.outputs.version }}';require('fs').writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"
          pnpm publish --tag experimental --provenance --no-git-checks

      # Publishes the version already committed in package.json; the tag
      # comes from publishConfig.tag (latest). Fails on a re-publish of an
      # existing version, so the release bump must land first.
      - name: Publish latest
        if: inputs.channel == 'latest'
        working-directory: packages/rangojs-router
        run: pnpm publish --provenance --no-git-checks

      - name: Comment on merged PR
        if: inputs.channel == 'experimental'
        run: |
          PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state merged --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "Published as \`@rangojs/router@${{ steps.version.outputs.version }}\`

          \`\`\`
          pnpm add @rangojs/router@${{ steps.version.outputs.version }}
          \`\`\`"
          else
            echo "No merged PR found for commit ${{ github.sha }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
