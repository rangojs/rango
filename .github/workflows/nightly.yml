name: Nightly

on:
  schedule:
    # Run at 04:00 UTC daily
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cloudflare-stress-demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build rangojs-router
        run: pnpm --filter @rangojs/router build

      - name: Install Playwright
        run: pnpm --filter cloudflare-stress-demo exec playwright install --with-deps chromium

      - name: Run cloudflare-stress-demo e2e tests
        run: pnpm --filter cloudflare-stress-demo test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cloudflare-stress-demo
          path: tests/cloudflare-stress-demo/playwright-report/
          retention-days: 7
