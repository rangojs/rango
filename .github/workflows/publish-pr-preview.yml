name: Publish PR Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: publish-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pr-publish
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Build @rangojs/router
        run: pnpm --filter @rangojs/router build

      - name: Compute preview version
        id: version
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="0.0.0-pr.${PR_NUMBER}.${SHORT_SHA}"

          echo "Preview version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version and publish
        working-directory: packages/rangojs-router
        run: |
          pnpm version "${{ steps.version.outputs.version }}" --no-git-tag-version
          pnpm publish --tag "pr-${{ github.event.pull_request.number }}" --provenance --no-git-checks

      - name: Comment on PR
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "Published preview as \`@rangojs/router@${{ steps.version.outputs.version }}\`

          \`\`\`
          pnpm add @rangojs/router@${{ steps.version.outputs.version }}
          \`\`\`"
        env:
          GH_TOKEN: ${{ github.token }}
